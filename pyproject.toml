[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-password-manager"
version = "0.1.0"
description = "A small encrypted desktop password manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.scripts]
password-manager = "password_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["password_manager*"]
